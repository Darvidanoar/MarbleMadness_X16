# ld65 configuration for the Commander X16 port (PRG loaded at $0801)
MEMORY {
    LOADADDR: start = $07FF, size = $0002, file = %O;
    MAIN:     start = $0801, size = $9900 - $0801, file = %O;
    GOLDEN:   start = $0400, size = $0400, type = rw, file = "";
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro, align = $100;
    BSS:      load = MAIN,     type = bss, align = $100;
    GOLDEN:   load = GOLDEN,   type = bss;
}
